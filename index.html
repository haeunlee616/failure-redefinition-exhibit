<script>
(() => {
  const Q = new URLSearchParams(location.search);
  const FAST = Q.has('fast');
  const t = ms => FAST ? ms * 0.35 : ms;

  // 화면 인덱스: 0=1번 표지, 1=2번, 2=3번, 3=4번(세로), 4=5번(Web Design 표지), 5=6번(세로)
  // 가로 한 화면짜리가 "입장 완료 후 머무는 시간"(ms). 현장에서 여기만 조정하면 됩니다.
  const HOLD = [6000, 9000, 6000, 0, 6500, 0];
  // 4~6번 모션 속도 배율(1.0 = 1~3번과 같은 속도). 클수록 느리고 차분해집니다.
  const SLOW = {3: 1.6, 4: 1.4, 5: 1.6};

  // 세로로 긴 페이지: 카메라가 멈췄다 내려가기를 반복. y = 화면 맨 위가 가리키는 위치
  const TALL = {
    3: {top: 4500, last: 'finale', stops: [
      {y: 520,  move: 1900, hold: 3200},                // 사전 목업 전체
      {y: 1620, move: 2300, hold: 2400, g: 'pages'},    // 사전 내지 1행
      {y: 2240, move: 1900, hold: 2600},                // 사전 내지 2행
      {y: 3100, move: 2700, hold: 5500, g: 'finale'},   // 총 6종 + 포스터(부채꼴 펼침 완료 후 머무는 시간)
    ]},
    5: {top: 4500, last: 'fan', stops: [
      {y: 640,  move: 1900, hold: 3500},                // 설문 화면 2장
      {y: 1640, move: 2400, hold: 4800, g: 'outcome'},  // Final Outcome + 4개 박스
      {y: 2921, move: 2600, hold: 2500, g: 'fan'},      // 카드 부채꼴 + 마무리 문구 → 카루셀 순환 → 잠시 정지
    ], after: () => carousel()},
  };

  // 화면별 글로우 위치/크기. big=표지용 큰 글로우, 아니면 작은 글로우. null=글로우 없음
  const GLOW = [
    {big: true,  cx: 147,   cy: 308,   r: 455},
    {big: false, cx: 867.5, cy: 272.5, r: 125.5},
    {big: false, cx: 897.5, cy: 226.5, r: 125.5},
    {big: false, cx: 911.5, cy: 174.5, r: 125.5},
    null,
    {big: false, cx: 911.5, cy: 174.5, r: 125.5},
  ];
  const UL_Y = [null, 0, -69, -118, null, -118];   // 밑줄 y 오프셋 (336 → 267 → 218)

  const EASE = 'cubic-bezier(.65,0,.35,1)';
  const OUT  = 'cubic-bezier(.22,1,.36,1)';
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const kebab = s => s.replace(/[A-Z]/g, c => '-' + c.toLowerCase());
  const commit = (el, to) => { for (const k in to) el.style.setProperty(kebab(k), to[k]); };

  // from -> to 애니메이션 후 최종 값을 style에 고정
  let K = 1;   // 현재 만드는 애니메이션의 속도 배율(enter/exit가 슬라이드별로 설정)
  function anim(el, from, to, {d = 800, delay = 0, ease = OUT} = {}) {
    const kf = from ? [from, to] : [to];
    const a = el.animate(kf, {duration: t(d * K), delay: t(delay * K), easing: ease, fill: 'both'});
    return a.finished.then(() => { commit(el, to); a.cancel(); }).catch(() => {});
  }

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const slides = ['#s0', '#s1', '#s2', '#s3', '#s4', '#s5'].map(s => $(s));
  const cam = $('#cam'), ul = $('#ul'), big = $('#glowBig'), small = $('#glowSmall');
  const lbl = $('#lbl'), bg5 = $('#bg5'), irisC = $('#irisC'), ring = $('#ring');

  const rvs = slide => $$('.rv', slide);

  function enter(slide, base = 0, group = '0') {
    const ps = [];
    const prevK = K; K = SLOW[slides.indexOf(slide)] || 1;
    for (const el of rvs(slide)) {
      if ((el.dataset.g || '0') !== group) continue;
      const k = el.dataset.k, d = base + (+el.dataset.d || 0), dur = +el.dataset.dur || 0;
      if (k === 'line')   ps.push(anim(el, {opacity: 0, transform: 'translateY(22px)'}, {opacity: 1, transform: 'translateY(0px)'}, {d: 900, delay: d}));
      else if (k === 'fade')   ps.push(anim(el, {opacity: 0}, {opacity: 1}, {d: dur || 900, delay: d, ease: 'ease'}));
      else if (k === 'pop')    ps.push(anim(el, {opacity: 0, transform: 'scale(.3)'}, {opacity: 1, transform: 'scale(1)'}, {d: 800, delay: d}));
      else if (k === 'poster') ps.push(anim(el, {opacity: 0, transform: 'translateY(70px)'}, {opacity: 1, transform: 'translateY(0px)'}, {d: dur || 1300, delay: d}));
      else if (k === 'slideL') ps.push(anim(el, {opacity: 0, transform: 'translateX(-90px)'}, {opacity: 1, transform: 'translateX(0px)'}, {d: 1400, delay: d}));
      else if (k === 'cardin') {
        // 카드가 가운데에 한 더미로 나타난 뒤, 가운데에서 먼 카드부터 양옆으로 미끄러지며 한 줄로 펼쳐짐
        const kk = +el.dataset.k0, inn = el.firstElementChild;
        commit(inn, {transform: STACK_POSE, filter: 'none'});
        ps.push(anim(el, {opacity: 0, transform: 'translateY(24px)'}, {opacity: 1, transform: 'translateY(0px)'}, {d: 1000, delay: d}));
        ps.push(anim(inn, null, {transform: kPose(kk), filter: tone(kk)}, {d: 1400, delay: d + 900 + (3 - Math.abs(kk)) * 0, ease: EASE}));
      }
      else if (k === 'fan') {
        // 한 더미로 쌓였다가(STACK) 가운데부터 바깥으로 부채꼴처럼 펼쳐져 제자리로
        const dx = +el.dataset.dx, rot = +el.dataset.rot, fanAt = base + (+el.dataset.fan);
        const STACK = 520 * K, FAN = 1200 * K, total = (fanAt - d) * K + FAN;
        const st = `translate(${dx}px,0px) rotate(${rot}deg) scale(1)`;
        const kf = [
          {opacity: 0, transform: `translate(${dx}px,50px) rotate(${rot}deg) scale(.9)`, offset: 0, easing: OUT},
          {opacity: 1, transform: st, offset: STACK / total},
          {opacity: 1, transform: st, offset: ((fanAt - d) * K) / total, easing: EASE},
          {opacity: 1, transform: 'translate(0px,0px) rotate(0deg) scale(1)', offset: 1},
        ];
        const a = el.animate(kf, {duration: t(total), delay: t(d * K), fill: 'both'});
        ps.push(a.finished.then(() => { commit(el, {opacity: 1, transform: 'translate(0px,0px) rotate(0deg) scale(1)'}); a.cancel(); }).catch(() => {}));
      }
      else if (k === 'wipe')  ps.push(anim(el, {opacity: 1, transform: 'scaleX(0)'}, {opacity: 1, transform: 'scaleX(1)'}, {d: dur || 700, delay: d, ease: EASE}));
      else if (k === 'draw') {
        const r = document.getElementById(el.dataset.mask);
        ps.push(anim(el, {opacity: 1}, {opacity: 1}, {d: 1, delay: d}));
        ps.push(anim(r, {strokeDashoffset: 100}, {strokeDashoffset: 0}, {d: dur || 1200, delay: d, ease: EASE}));
      }
    }
    K = prevK;
    return Promise.all(ps);
  }

  function exit(slide, dy = -14, kOverride) {
    const ps = [];
    const prevK = K; K = kOverride || SLOW[slides.indexOf(slide)] || 1;
    const els = rvs(slide);
    els.forEach((el, i) => {
      const k = el.dataset.k, ex = el.dataset.ex, delay = Math.min(i * 40, 420);
      const reset = () => { el.removeAttribute('style'); };
      if (ex === 'fly') {
        // 표지의 점 두 개 → 글로우 쪽으로 날아가 합쳐짐
        const to = {cx: '880px', cy: '272px', r: '3px', opacity: 0};
        ps.push(anim(el, null, to, {d: 1300, delay: 100 + i * 60, ease: EASE}).then(reset));
      } else if (ex === 'right') {
        ps.push(anim(el, null, {opacity: 0, transform: 'translateX(150px)'}, {d: 900, delay: 100 + i * 90, ease: EASE}).then(reset));
      } else if (k === 'wipe' || k === 'draw') {
        ps.push(anim(el, null, {opacity: 0}, {d: 500, delay, ease: 'ease'}).then(() => {
          reset(); if (el.dataset.mask) document.getElementById(el.dataset.mask).removeAttribute('style');
        }));
      } else {
        ps.push(anim(el, null, {opacity: 0, transform: `translateY(${dy}px)`}, {d: 550, delay, ease: 'ease-in'}).then(reset));
      }
    });
    K = prevK;
    return Promise.all(ps);
  }

  let curGlow = null;
  function moveGlow(to, delay, d, first) {
    const g = GLOW[to], inn = g.big ? big : small, out = g.big ? small : big;
    const geo = {cx: g.cx + 'px', cy: g.cy + 'px', r: g.r + 'px'};
    const ps = [];
    if (first) { commit(inn, geo); return anim(inn, {opacity: 0}, {opacity: 1}, {d: 1600, delay, ease: 'ease'}); }
    if (curGlow !== null && GLOW[curGlow].big !== g.big) {
      // 반대 타입으로 바뀔 때: 들어오는 글로우를 나가는 글로우 위치에서 시작시켜 하나의 빛처럼 보이게
      const cs = getComputedStyle(out);
      commit(inn, {cx: cs.cx, cy: cs.cy, r: cs.r});
      ps.push(anim(out, null, {...geo, opacity: 0}, {d, delay, ease: EASE}));
      ps.push(anim(inn, {opacity: 0}, {...geo, opacity: 1}, {d, delay, ease: EASE}));
    } else {
      ps.push(anim(inn, null, {...geo, opacity: 1}, {d, delay, ease: EASE}));
    }
    return Promise.all(ps);
  }

  // 4→5 : 소주제(챕터)가 바뀌는 전환.
  // 페이지 내용이 가라앉는 동안 포스터 부채꼴 자리(화면 아래쪽)에서 빛의 고리가 퍼져 나가며
  // 완전히 다른 톤의 새 배경을 드러내고, 그 위로 제목·목업이 들어온다.
  async function chapterIn() {
    const jobs = [];
    // 다른 페이지 전환과 같은 결: 4번 내용이 위로 사라지고, 5번 배경이 부드럽게 겹쳐 나타난 뒤 내용이 들어옴
    jobs.push(exit(slides[3], -14));
    K = 1;
    commit(irisC, {r: '1900px'});          // 5번 배경은 마스크 없이 전체 표시(페이드로만 등장)
    commit(bg5, {opacity: 0});
    jobs.push(anim(bg5, null, {opacity: 1}, {d: 1500, delay: 700, ease: 'ease'}));
    jobs.push(anim(small, null, {opacity: 0}, {d: 700, delay: 100, ease: 'ease'}));
    jobs.push(anim(ul, null, {opacity: 0}, {d: 500, ease: 'ease'}).then(() => ul.removeAttribute('style')));
    jobs.push(enter(slides[4], 1200));    await Promise.all(jobs);
    commit(lbl, {opacity: 0});             // 6번은 자체 'WEB DESIGN' 라벨을 쓰므로 기본 라벨 숨김(5번 배경에 가려진 상태)
    cam.removeAttribute('style');          // 가려진 사이 카메라를 맨 위로 복귀
  }

  async function transition(from, to) {
    const first = from === null;
    if (to === 4 && from === 3) return chapterIn();
    const jobs = [];
    let enterAt = 0, glowAt = 150;
    if (to === 4) commit(irisC, {r: '1900px'});          // 바로 5번부터 시작하는 경우
    if (to === 5 && first) commit(lbl, {opacity: 0});    // 바로 6번부터 시작하는 경우
    if (from === 5) jobs.push(anim(lbl, null, {opacity: 1}, {d: 900, delay: 1800, ease: 'ease'}));   // 6→1: 'PRINTING' 라벨 복귀
    if (!first) {
      // 3→4: 위로 크게 빠져나가며 '아래로 이어지는 페이지'임을 예고
      jobs.push(exit(slides[from], to === 3 ? -44 : -14));
      enterAt = 950;
      if (from === 3 || from === 5) {     // 세로 페이지 → 표지: 카메라가 맨 위로 되감기며 내용이 사라짐
        jobs.push(anim(cam, null, {transform: 'translateY(0px)'}, {d: 2200, delay: 100, ease: EASE}));
        glowAt = 1500; enterAt = 2400;
      }
      if (from === 4) {                   // 5→6: 챕터 표지 배경이 걷히며 어두운 페이지로
        jobs.push(anim(bg5, null, {opacity: 0}, {d: 1300, delay: 300, ease: 'ease'}).then(() => { bg5.removeAttribute('style'); irisC.removeAttribute('style'); }));
      }
    }
    if (GLOW[to]) jobs.push(moveGlow(to, first ? 0 : glowAt, first ? 0 : 1500, first));

    // 밑줄 (336 → 267 → 218)
    const ulT = `translateY(${UL_Y[to]}px)`;
    if (to === 0 || to === 4) {           // 사라짐
      jobs.push(anim(ul, null, {opacity: 0}, {d: 600, delay: 0, ease: 'ease'}).then(() => ul.removeAttribute('style')));
    } else if (first || from === 0 || from === 4) {     // 새로 그어짐
      commit(ul, {transform: ulT + ' scaleX(0)', opacity: 1});
      jobs.push(anim(ul, null, {transform: ulT + ' scaleX(1)', opacity: 1}, {d: 800, delay: enterAt + 350, ease: EASE}));
    } else {                              // 위로 이동
      jobs.push(anim(ul, null, {transform: ulT + ' scaleX(1)', opacity: 1}, {d: 1000, delay: 200, ease: EASE}));
    }

    jobs.push(enter(slides[to], enterAt));
    await Promise.all(jobs);
  }

  // 6번 맨 아래 카드 가로 카루셀: 가운데 카드가 가장 크고 또렷하게 멈춰 있다가, 줄 전체가 왼쪽으로 한 칸씩 밀림.
  // 왼쪽 끝 카드는 화면 왼쪽 밖으로 나갔다가 오른쪽 밖에서 다시 들어옴. 뒤로 갈수록 작고 어둡게(투명도 사용 안 함).
  const CARD_HOLD = 2000;      // 카드 한 장이 가운데에서 멈춰 있는 시간(ms)
  const CARD_MOVE = 1100;      // 한 칸 밀리는 시간(ms)
  const CARD_CY = 3260;        // 카드 줄의 세로 중심(세계 좌표)
  // 자리(k): 0=가운데, 음수=왼쪽, 양수=오른쪽. [x, 기울기(deg), 크기, 밝기]
  const KSLOT = {
    '-3': [-300, -10, 0.45, 0.50],   // 화면 밖(왼쪽)
    '-2': [340, -8, 0.54, 0.62],
    '-1': [587, -5, 0.68, 0.78],
    '0':  [960, 0, 0.85, 1.00],
    '1':  [1333, 5, 0.68, 0.78],
    '2':  [1580, 8, 0.54, 0.62],
    '3':  [1810, 10, 0.45, 0.50],
    '4':  [2200, 12, 0.45, 0.50],    // 화면 밖(오른쪽)
  };
  const poseAt = (x, r, s) => `translate(${x}px,${CARD_CY}px) rotate(${r}deg) scale(${s}) translate(-240.4px,-338.35px)`;
  const kPose = k => poseAt(KSLOT[k][0], KSLOT[k][1], KSLOT[k][2]);
  const tone = k => `brightness(${KSLOT[k][3]})`;
  const STACK_POSE = poseAt(960, 0, 0.85);
  function kfAnim(el, kf, {d, delay = 0, ease = EASE}) {
    const a = el.animate(kf, {duration: t(d), delay: t(delay), easing: ease, fill: 'both'});
    const last = {}; for (const k in kf[kf.length - 1]) if (k !== 'offset' && k !== 'easing') last[k] = kf[kf.length - 1][k];
    return a.finished.then(() => { commit(el, last); a.cancel(); }).catch(() => {});
  }
  async function carousel() {
    K = 1;
    const ws = $$('.rv[data-k="cardin"]', slides[5]);
    const parent = ws[0].parentNode, anchor = ws[ws.length - 1].nextSibling;
    const inner = w => w.firstElementChild;
    const pos = new Map(ws.map(w => [w, +w.dataset.k0]));
    const zOrder = m => [...ws].sort((a, b) => Math.abs(m.get(b)) - Math.abs(m.get(a))).forEach(w => parent.insertBefore(w, anchor));   // 가운데에서 멀수록 아래
    zOrder(pos);
    // 6번 밀면 한 바퀴 돌아 처음 배치로 돌아옴. 모든 카드가 한 번씩 가운데에 옴
    for (let step = 0; step < ws.length; step++) {
      await sleep(t(CARD_HOLD));
      const next = new Map(ws.map(w => { const k = pos.get(w); return [w, k === -2 ? 3 : k - 1]; }));
      zOrder(next);
      const ps = [];
      ws.forEach(w => {
        const k = pos.get(w), n = next.get(w), el = inner(w);
        if (k === -2) {       // 왼쪽 끝 카드: 화면 왼쪽 밖으로 나갔다가, 오른쪽 밖에서 맨 뒤 자리로 들어옴
          ps.push(kfAnim(el, [
            {transform: kPose(-2), filter: tone(-2), offset: 0},
            {transform: kPose(-3), filter: tone(-3), offset: 0.38},
            {transform: kPose(4), filter: tone(4), offset: 0.44},
            {transform: kPose(n), filter: tone(n), offset: 1}], {d: CARD_MOVE * 1.8}));
          // 화면 밖에 있는 짧은 순간에만 숨겨, 가로질러 가는 모습이 보이지 않게 함
          ps.push(kfAnim(w, [{opacity: 1, offset: 0}, {opacity: 1, offset: 0.37}, {opacity: 0, offset: 0.39}, {opacity: 0, offset: 0.43}, {opacity: 1, offset: 0.45}, {opacity: 1, offset: 1}], {d: CARD_MOVE * 1.8}));
        } else {
          ps.push(anim(el, null, {transform: kPose(n), filter: tone(n)}, {d: CARD_MOVE, ease: EASE}));
        }
      });
      next.forEach((v, w) => pos.set(w, v));
      await Promise.all(ps);
    }
  }

  // 세로 페이지: 처음 화면에서 읽을 시간을 준 뒤, 구간별로 부드럽게 내려가며 아래 요소가 도착할 때 나타남
  async function playTall(idx) {
    const C = TALL[idx];
    await sleep(t(C.top));
    for (const s of C.stops) {
      const reveal = s.g ? enter(slides[idx], 0, s.g) : null;
      K = SLOW[idx] || 1;
      const move = anim(cam, null, {transform: `translateY(${-s.y}px)`}, {d: s.move, ease: EASE});
      K = 1;
      await move;
      if (s.g === C.last) {               // 마지막 연출은 끝까지 보여준 뒤 머무름
        await reveal;
        if (C.after) await C.after();
        await sleep(t(s.hold));
      } else {
        await sleep(t(s.hold));
        if (reveal) await reveal;
      }
    }
  }

  async function main() {
    let cur = null;
    let i = Math.max(0, Math.min(5, (+Q.get('s') || 1) - 1));
    for (;;) {
      await transition(cur, i);
      if (GLOW[i]) curGlow = i;
      cur = i;
      if (TALL[i]) await playTall(i); else await sleep(t(HOLD[i]));
      i = (i + 1) % slides.length;
    }
  }
  main();
})();
</script>
</body>
</html>
